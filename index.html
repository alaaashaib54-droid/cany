<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cany</title>
<style>
:root{--blue:#1e5fd6;--blue2:#123f95;--orange:#ff8a1f;--bg:#f2f6ff;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#dbe4f7;--sky:#e6f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1730;--card:#16244a;--tx:#eef3ff;--mut:#9fb0d6;--bd:#27407a;--sky:#10275a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:800;letter-spacing:1px;direction:ltr}.logo b{color:var(--orange)}
header .sp{flex:1}
.pill{background:rgba(255,255,255,.15);border-radius:20px;padding:6px 12px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--orange);color:#fff;font-weight:700}
button.g{background:var(--sky);color:var(--blue)}
button.d{background:transparent;color:#d33;padding:4px 8px}
input,select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-width:0}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.add input{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;transition:.2s;border-top:5px solid var(--orange)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,95,214,.18)}
.card h3{margin:4px 0;font-size:17px}.card small{color:var(--mut)}
.bar{height:8px;background:var(--sky);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .5s}
.mini svg{height:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.task{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px dashed var(--bd)}
.task:last-child{border:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--blue);background:transparent;color:#fff;padding:0;font-size:16px;flex:none}
.task.on .chk{background:#2e9e45;border-color:#2e9e45}
.task .t{flex:1;word-break:break-word}.task.on .t{text-decoration:line-through;color:var(--mut)}
.num{color:var(--orange);font-weight:800;min-width:22px}
.mv{background:none;color:var(--mut);padding:2px 5px}
.treebox{background:linear-gradient(var(--sky),var(--card));border-radius:14px;text-align:center}
.treebox svg{width:100%;max-height:380px}
.big{font-size:26px;font-weight:800;color:var(--blue)}
.apple{animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.tg{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.win{background:var(--orange);color:#fff;border-radius:12px;padding:10px;margin-top:8px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px}
</style>
</head>
<body>
<header><div class="logo">c<b>a</b>ny</div><div class="sp"></div><div class="pill" id="stat"></div>
<button class="g" data-a="exp">💾 نسخة</button><button class="g" data-a="imp">📂 استرجاع</button>
<input type="file" id="f" accept=".json" hidden></header>
<main id="app"></main>
<script>
window.onerror=function(m){var d=document.getElementById("app");if(d)d.insertAdjacentHTML("afterbegin",'<div class="win">⚠️ '+m+'</div>')};
var TY={course:["📚","كورس"],vol:["🤝","تطوع"],prog:["💻","برنامج"],fel:["🎓","زمالة"],tr:["🏢","تدريب"],oth:["✨","أخرى"]};
var S={folders:[]},view=null,armed=null;
try{var r=localStorage.getItem("cany");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("cany",JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function prog(f){var n=f.tasks.length,d=f.tasks.filter(function(t){return t.d}).length;return{n:n,d:d,p:n?d/n:0}}
function tree(f){
 var q=prog(f),n=q.n,sc=.45+.55*q.p,h="";
 var rad=Math.max(14,36-n*1.3);
 for(var i=0;i<n;i++){
  var r=Math.sqrt((i+.5)/n),a=i*2.4,x=150+r*(105-rad*.4)*Math.cos(a),y=130+r*(75-rad*.3)*Math.sin(a),dn=f.tasks[i].d;
  h+='<line x1="150" y1="215" x2="'+x+'" y2="'+y+'" stroke="#7a4b1f" stroke-width="3"/>';
  h+='<circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+(dn?"#2e9e45":"#8fd19a")+'"/>';
  h+='<circle cx="'+(x-rad*.25)+'" cy="'+(y-rad*.25)+'" r="'+rad*.55+'" fill="'+(dn?"#3fbf5a":"#a9e0b1")+'" opacity=".7"/>';
  if(dn)h+='<g class="apple" style="transform-origin:'+x+'px '+y+'px"><circle cx="'+x+'" cy="'+(y+2)+'" r="'+Math.max(7,rad*.4)+'" fill="#e8332a"/><circle cx="'+(x-2)+'" cy="'+(y-1)+'" r="2" fill="#fff" opacity=".6"/><path d="M'+x+' '+(y-rad*.4)+' q3 -6 7 -7" stroke="#5a3a1a" stroke-width="2" fill="none"/></g>';
 }
 if(!n)h='<text x="150" y="180" text-anchor="middle" font-size="16" fill="#2e9e45">ضيفي مهام عشان الشجرة تنمو 🌱</text>';
 return '<svg viewBox="0 0 300 320"><ellipse cx="150" cy="298" rx="120" ry="14" fill="#3b8a3f" opacity=".35"/><g class="tg" style="transform-origin:150px 296px;transform:scale('+sc+')"><path d="M138 296 Q146 250 144 205 L156 205 Q154 250 162 296Z" fill="#8b5a2b"/>'+h+'</g></svg>';
}
function render(){
 var tot=0,dn=0;S.folders.forEach(function(f){var q=prog(f);tot+=q.n;dn+=q.d});
 document.getElementById("stat").textContent="🍎 "+dn+" / "+tot+" مهمة";
 var f=S.folders.filter(function(x){return x.id==view})[0],h="";
 if(!f){view=null;
  h='<div class="add"><input id="nm" placeholder="اسم الملف (كورس، تطوع، زمالة...)"><select id="ty">'+Object.keys(TY).map(function(k){return'<option value="'+k+'">'+TY[k][0]+" "+TY[k][1]+"</option>"}).join("")+'</select><button data-a="addf">+ ملف جديد</button></div>';
  if(!S.folders.length)h+='<div class="empty">📁 لسه مفيش ملفات. اعملي أول ملف وابدئي تزرعي شجرتك 🌳</div>';
  h+='<div class="grid">'+S.folders.map(function(x){var q=prog(x);return'<div class="card" data-a="open" data-id="'+x.id+'"><small>'+TY[x.ty][0]+" "+TY[x.ty][1]+'</small><h3>'+esc(x.name)+'</h3><div class="mini treebox">'+tree(x)+'</div><div class="bar"><i style="width:'+q.p*100+'%"></i></div><small>'+q.d+" من "+q.n+" مهمة</small></div>"}).join("")+"</div>";
 }else{var q=prog(f);
  h='<button class="g" data-a="back">→ كل الملفات</button><h2>'+TY[f.ty][0]+" "+esc(f.name)+' <button class="d" data-a="delf">'+(armed==="f"?"تأكيد الحذف؟":"🗑 حذف الملف")+'</button></h2><div class="two"><div class="panel"><div class="add"><input id="tk" placeholder="مهمة جديدة..."><button data-a="addt">+ ضيف</button></div>';
  if(!q.n)h+='<div class="empty">اكتبي المهام بالترتيب 👆</div>';
  h+=f.tasks.map(function(t,i){return'<div class="task'+(t.d?" on":"")+'"><span class="num">'+(i+1)+'</span><button class="chk" data-a="tog" data-i="'+i+'">'+(t.d?"✓":"")+'</button><span class="t">'+esc(t.t)+'</span><button class="mv" data-a="up" data-i="'+i+'">▲</button><button class="mv" data-a="dn" data-i="'+i+'">▼</button><button class="d" data-a="delt" data-i="'+i+'">✕</button></div>'}).join("");
  h+='</div><div class="panel treebox">'+tree(f)+'<div class="big">'+Math.round(q.p*100)+'%</div><div>🍎 '+q.d+" تفاحة من "+q.n+'</div>'+(q.n&&q.d==q.n?'<div class="win">🎉 مبروك! الشجرة اكتملت وخلصتي الملف ده كله</div>':"")+"</div></div>";
 }
 document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,i=+b.dataset.i,f=S.folders.filter(function(x){return x.id==view})[0];
 if(a!="delf"&&a!="delt")armed=null;
 if(a=="addf"){var ni=document.getElementById("nm"),n=ni.value.trim();if(!n){ni.style.borderColor="#e8332a";ni.placeholder="اكتبي اسم الملف الأول ☝️";ni.focus();return}S.folders.push({id:Date.now(),name:n,ty:document.getElementById("ty").value,tasks:[]})}
 else if(a=="open")view=b.dataset.id;
 else if(a=="back")view=null;
 else if(a=="addt"){var ti=document.getElementById("tk"),t=ti.value.trim();if(!t){ti.style.borderColor="#e8332a";ti.placeholder="اكتبي المهمة الأول ☝️";ti.focus();return}f.tasks.push({t:t,d:false})}
 else if(a=="tog")f.tasks[i].d=!f.tasks[i].d;
 else if(a=="up"&&i>0){var x=f.tasks.splice(i,1)[0];f.tasks.splice(i-1,0,x)}
  else if(a=="dn"&&i<f.tasks.length-1){var y=f.tasks.splice(i,1)[0];f.tasks.splice(i+1,0,y)}
 else if(a=="delt"){if(armed=="t"+i){f.tasks.splice(i,1);armed=null}else{armed="t"+i;setTimeout(function(){armed=null},2500);b.textContent="؟";return}}
 else if(a=="delf"){if(armed=="f"){S.folders=S.folders.filter(function(x){return x!==f});view=null;armed=null}else{armed="f";render();return}}
 else if(a=="exp"){var l=document.createElement("a");l.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));l.download="cany-backup.json";l.click();return}
 else if(a=="imp"){document.getElementById("f").click();return}
 save();render();
});
document.addEventListener("keydown",function(e){if(e.key=="Enter"){var t=e.target.id;if(t=="nm")document.querySelector("[data-a=addf]").click();if(t=="tk")document.querySelector("[data-a=addt]").click()}});
document.getElementById("f").addEventListener("change",function(e){var fl=e.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(d.folders){S=d;view=null;save();render()}}catch(x){}};rd.readAsText(fl)});
render();
</script>
</body>
</html>
